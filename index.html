<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Troleybus Museum</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --red:      #b83a2a;
      --red-dark: #8c2a1d;
      --beige:    #ede6d8;
      --stone:    #c4b9a8;
      --concrete: #8a8480;
      --dark:     #2a2320;
      --off-white:#f7f3ed;
    }

    html, body {
      height: 100%;
      background: var(--off-white);
      color: var(--dark);
      font-family: 'Inter', sans-serif;
    }

    header {
      background: var(--dark);
      padding: 0 48px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--beige);
    }

    .rule { height: 4px; background: var(--red); }

    .video-outer {
      width: 100%;
      background: var(--dark);
    }

    .video-section {
      max-width: 1600px;
      margin: 0 auto;
    }

    .iframe-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 400px;
      background: #000;
    }

    .video-section iframe {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      border: none;
    }

    /* ── Mobile video poster ── */
    .mobile-poster {
      display: none;
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .mobile-poster img.poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mobile-poster .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(0, 0, 0, 0.38);
      transition: background 0.2s;
    }

    .mobile-poster:active .play-overlay {
      background: rgba(0, 0, 0, 0.55);
    }

    .play-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      transition: transform 0.15s, background 0.15s;
    }

    .mobile-poster:active .play-btn {
      transform: scale(0.93);
      background: var(--red-dark);
    }

    .play-btn svg {
      width: 28px;
      height: 28px;
      fill: #fff;
      margin-left: 4px;
    }

    .play-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--beige);
      opacity: 0.9;
    }

    footer {
      background: var(--dark);
      color: var(--concrete);
      text-align: center;
      padding: 20px 48px;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    html {
      scrollbar-width: none;
    }
    html::-webkit-scrollbar {
      display: none;
    }

    #tram-bar {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: 96px;
      pointer-events: none;
      z-index: 999;
    }

    #tram-bar::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      background: repeating-linear-gradient(
        to bottom,
        var(--stone) 0px,
        var(--stone) 8px,
        transparent 8px,
        transparent 14px
      );
    }

    #tram-thumb {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 84px;
      pointer-events: none;
      transition: top 0.08s linear;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
    }

    @media (max-width: 768px) {
      header { padding: 0 20px; }
      #tram-bar { display: none; }

      .iframe-wrap { display: none; }
      .mobile-poster { display: block; }
    }
  </style>
</head>
<body>

  <header>
    <span class="site-name">Troleybus Museum</span>
  </header>

  <div class="rule"></div>

  <div class="video-outer">
    <div class="video-section">

      <!-- Desktop: iframe embed -->
      <div class="iframe-wrap">
        <iframe
          src="https://drive.google.com/file/d/1BXmKeeA_nw3RHbzaLyIv0Mlhjkua5xiB/preview"
          allow="autoplay; fullscreen"
          allowfullscreen
          loading="eager">
        </iframe>
      </div>

      <!-- Mobile: poster + drive link -->
      <div class="mobile-poster" id="mobilePoster"
           role="button" aria-label="Videoyu izle">
        <img class="poster-img" src="thumb.jpg" alt="Video kapak görseli" />
        <div class="play-overlay">
          <div class="play-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </div>
          <span class="play-label">Videoyu İzle</span>
        </div>
      </div>

    </div>
  </div>

  <footer>Troleybus Museum</footer>

  <div id="tram-bar">
    <img id="tram-thumb" src="tram.png" alt="tram" />
  </div>

  <script>
    document.getElementById('mobilePoster').addEventListener('click', function () {
      const wrap = document.createElement('div');
      wrap.className = 'iframe-wrap';
      wrap.style.display = 'block';

      const iframe = document.createElement('iframe');
      iframe.src = 'https://drive.google.com/file/d/1BXmKeeA_nw3RHbzaLyIv0Mlhjkua5xiB/preview';
      iframe.setAttribute('allow', 'autoplay; fullscreen');
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('loading', 'eager');

      wrap.appendChild(iframe);
      this.parentNode.insertBefore(wrap, this);
      this.remove();
    });

    const thumb = document.getElementById('tram-thumb');

    function moveTram() {
      const scrollTop = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const ratio     = maxScroll > 0 ? scrollTop / maxScroll : 0;
      const imgH      = thumb.offsetHeight || 100;
      const padding   = 10;
      const trackEnd  = window.innerHeight - imgH - padding;
      thumb.style.top = (padding + ratio * (trackEnd - padding)) + 'px';
    }

    window.addEventListener('scroll', moveTram, { passive: true });
    window.addEventListener('resize', moveTram);
    thumb.addEventListener('load', moveTram);
    moveTram();
  </script>

</body>
</html>
