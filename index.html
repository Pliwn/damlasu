<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Troleybus Museum</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --red:      #b83a2a;
      --red-dark: #8c2a1d;
      --beige:    #ede6d8;
      --stone:    #c4b9a8;
      --concrete: #8a8480;
      --dark:     #2a2320;
      --off-white:#f7f3ed;
    }

    html, body {
      height: 100%;
      background: var(--off-white);
      color: var(--dark);
      font-family: 'Inter', sans-serif;
    }

    header {
      background: var(--dark);
      padding: 0 48px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--beige);
    }

    .rule { height: 4px; background: var(--red); }

    .video-outer {
      width: 100%;
      background: var(--dark);
    }

    .video-section {
      max-width: 1600px;
      margin: 0 auto;
    }

    .iframe-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 400px;
      background: #000;
    }

    .video-section iframe {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      border: none;
    }

    footer {
      background: var(--dark);
      color: var(--concrete);
      text-align: center;
      padding: 20px 48px;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    html {
      scrollbar-width: none;
    }
    html::-webkit-scrollbar {
      display: none;
    }

    #tram-bar {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: 96px;
      pointer-events: none;
      z-index: 999;
    }

    #tram-bar::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      background: repeating-linear-gradient(
        to bottom,
        var(--stone) 0px,
        var(--stone) 8px,
        transparent 8px,
        transparent 14px
      );
    }

    #tram-thumb {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 84px;
      pointer-events: none;
      transition: top 0.08s linear;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
    }

    @media (max-width: 600px) {
      header { padding: 0 20px; }
      #tram-bar { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <span class="site-name">Troleybus Museum</span>
  </header>

  <div class="rule"></div>

  <div class="video-outer">
    <div class="video-section">
      <div class="iframe-wrap">
        <iframe
          src="https://drive.google.com/file/d/1BXmKeeA_nw3RHbzaLyIv0Mlhjkua5xiB/preview"
          allow="autoplay; fullscreen"
          allowfullscreen
          loading="eager">
        </iframe>
      </div>
    </div>
  </div>

  <footer>Troleybus Museum</footer>

  <div id="tram-bar">
    <img id="tram-thumb" src="tram.png" alt="tram" />
  </div>

  <script>
    const thumb = document.getElementById('tram-thumb');

    function moveTram() {
      const scrollTop = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const ratio     = maxScroll > 0 ? scrollTop / maxScroll : 0;
      const imgH      = thumb.offsetHeight || 100;
      const padding   = 10;
      const trackEnd  = window.innerHeight - imgH - padding;
      thumb.style.top = (padding + ratio * (trackEnd - padding)) + 'px';
    }

    window.addEventListener('scroll', moveTram, { passive: true });
    window.addEventListener('resize', moveTram);
    thumb.addEventListener('load', moveTram);
    moveTram();
  </script>

</body>
</html>
